    <script>
        // Immediate storage purge for old JumpServer theme cache
        try {
            localStorage.removeItem('themeColors');
            const theme = localStorage.getItem('theme');
            if (theme && theme !== 'allsafex') {
                localStorage.removeItem('theme');
            }
            const phoneCode = localStorage.getItem('prePhoneCode');
            if (!phoneCode || phoneCode === '+86') {
                localStorage.setItem('prePhoneCode', '+251');
            }
            const cookieMatch = document.cookie.match(/django_language=([^;]+)/);
            if (cookieMatch && (cookieMatch[1] === 'am' || cookieMatch[1] === 'en')) {
                localStorage.setItem('django_language', cookieMatch[1]);
            }
            const lang = localStorage.getItem('django_language') || '';
            if (lang && lang !== 'en' && lang !== 'am') {
                localStorage.setItem('django_language', 'en');
                document.cookie = 'django_language=en;path=/;max-age=31536000';
            }
        } catch(e) {}

        // Immediate application of Safety Orange root styles
        try {
            const root = document.documentElement;
            root.style.setProperty('--color-primary', '#FF7900', 'important');
            root.style.setProperty('--el-color-primary', '#FF7900', 'important');
            root.style.setProperty('--banner-bg', '#000000', 'important');
            root.style.setProperty('--menu-text-active', '#FF7900', 'important');
            root.style.setProperty('--color-link', '#FF7900', 'important');
        } catch(e) {}

        // Ensure loading spinner never hangs indefinitely
        window.addEventListener('load', function() {
            setTimeout(function() {
                const l = document.getElementById('loading');
                if (l) {
                    l.style.opacity = '0';
                    l.style.transition = 'opacity 0.3s ease';
                    setTimeout(function() {
                        if (l && l.parentNode) l.parentNode.removeChild(l);
                    }, 300);
                }
            }, 800);
        });
    </script>

    <!-- AllSafeX Custom Theme & Brand Configuration -->
    <script>
        (function() {
            // Keep document title strictly synced to AllSafeX
            try {
                document.title = 'AllSafeX';
                const originalTitle = Object.getOwnPropertyDescriptor(Document.prototype, 'title');
                if (originalTitle && originalTitle.set) {
                    Object.defineProperty(document, 'title', {
                        set: function(val) {
                            if (typeof val === 'string') {
                                val = val.replace(/JumpServer/gi, 'AllSafeX');
                            }
                            originalTitle.set.call(this, val);
                        },
                        get: function() {
                            return originalTitle.get.call(this);
                        }
                    });
                }
            } catch(e) {}

            function replaceBrand(node) {
                if (!node) return;
                if (node.nodeType === Node.TEXT_NODE) {
                    if (node.nodeValue) {
                        let text = node.nodeValue;
                        if (text.includes('JumpServer')) {
                            text = text.replace(/JumpServer/g, 'AllSafeX');
                        }
                        // Replace exact standalone component names in titles/menus if present
                        if (/\bKoKo\b/.test(text)) {
                            text = text.replace(/\bKoKo\b/g, 'AllSafeX SSH Gateway');
                        }
                        if (/\bLuna\b/.test(text) && !text.includes('LunaSetting')) {
                            text = text.replace(/\bLuna\b/g, 'AllSafeX Workspace');
                        }
                        if (node.nodeValue !== text) {
                            node.nodeValue = text;
                        }
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    if (node.tagName === 'A') {
                        if (node.href && node.href.includes('github.com/jumpserver')) {
                            node.href = 'https://github.com/danieldestaw/allsafex';
                        }
                        if (node.href && (node.href.includes('jumpserver.com/docs') || node.href.includes('docs.jumpserver.org') || node.href.includes('jumpserver.org'))) {
                            node.href = 'https://allsafex-pam.allsafex.com/';
                        }
                    }
                    if (node.tagName === 'SCRIPT' || node.tagName === 'STYLE' || node.tagName === 'INPUT' || node.tagName === 'TEXTAREA') return;
                    for (let i = 0; i < node.childNodes.length; i++) {
                        replaceBrand(node.childNodes[i]);
                    }
                }
            }

            function enforceLogos() {
                const textLogos = document.querySelectorAll(".sidebar-logo-text, .nav-logo img");
                for (let i = 0; i < textLogos.length; i++) {
                    const img = textLogos[i];
                    if (!img.src || !img.src.includes("logo_text_white.png")) {
                        img.src = "/static/img/logo_text_white.png";
                    }
                }
                const iconLogos = document.querySelectorAll(".sidebar-logo:not(.sidebar-logo-text)");
                for (let i = 0; i < iconLogos.length; i++) {
                    const img = iconLogos[i];
                    if (!img.src || !img.src.includes("logo.png")) {
                        img.src = "/static/img/logo.png";
                    }
                }
            }

            let logoTimer = null;
            function debouncedEnforceLogos() {
                if (logoTimer) return;
                logoTimer = setTimeout(function() {
                    logoTimer = null;
                    enforceLogos();
                }, 200);
            }

            const brandObserver = new MutationObserver(function(mutations) {
                for (let i = 0; i < mutations.length; i++) {
                    const added = mutations[i].addedNodes;
                    for (let j = 0; j < added.length; j++) {
                        replaceBrand(added[j]);
                    }
                }
                debouncedEnforceLogos();
            });

            window.addEventListener('DOMContentLoaded', function() {
                replaceBrand(document.body);
                enforceLogos();
                brandObserver.observe(document.body, { childList: true, subtree: true });
            });

            setInterval(enforceLogos, 1000);
        })();
    </script>

<script>
(function() {
    const RAIL_MODULES = [
        {
            id: 'console',
            path: '/console/dashboard',
            hashMatch: /^\/console/i,
            icon: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>'
        },
        {
            id: 'pam',
            path: '/pam/dashboard',
            hashMatch: /^\/pam/i,
            icon: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><circle cx="12" cy="11" r="2"></circle><path d="M12 13v3"></path></svg>'
        },
        {
            id: 'audit',
            path: '/audit/dashboard',
            hashMatch: /^\/audit/i,
            icon: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="13" y2="17"></line><polyline points="9 9 10 9 11 9"></polyline></svg>'
        },
        {
            id: 'workbench',
            path: '/workbench/home',
            hashMatch: /^\/workbench/i,
            icon: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line><polyline points="7 8 10 10.5 7 13"></polyline><line x1="12" y1="13" x2="16" y2="13"></line></svg>'
        }
    ];

    const I18N = {
        en: { console: 'Console', pam: 'PAM', audit: 'Audit', workbench: 'Workbench' },
        am: { console: 'ኮንሶል', pam: 'PAM', audit: 'ኦዲት', workbench: 'የስራ ቦታ' },
        zh: { console: '控制台', pam: 'PAM', audit: '审计台', workbench: '工作台' },
        es: { console: 'Consola', pam: 'PAM', audit: 'Auditoría', workbench: 'Espacio' }
    };

    function getLocale() {
        return localStorage.getItem('django_language') || (document.cookie.match(/django_language=([^;]+)/) || [])[1] || 'en';
    }

    function getLabel(modId) {
        const lang = getLocale();
        const dict = I18N[lang] || I18N.en;
        return dict[modId] || I18N.en[modId] || modId;
    }

    function detectActiveModule() {
        const hash = (window.location.hash || '').replace(/^#/, '');
        for (const mod of RAIL_MODULES) {
            if (mod.hashMatch.test(hash)) return mod.id;
        }
        const preView = localStorage.getItem('preView');
        if (preView && RAIL_MODULES.some(m => m.id === preView)) {
            return preView;
        }
        try {
            const v = window.__STORE__?.state?.permission?.currentViewRoute?.meta?.view || window.__STORE__?.getters?.currentViewRoute?.name;
            if (v && RAIL_MODULES.some(m => m.id === v)) return v;
        } catch(e) {}
        return 'console';
    }

    let currentActiveId = null;
    function updateActiveUI(activeId) {
        if (currentActiveId === activeId) return;
        currentActiveId = activeId;
        const items = document.querySelectorAll('.allsafex-rail-item');
        for (let i = 0; i < items.length; i++) {
            const el = items[i];
            if (el.getAttribute('data-id') === activeId) {
                el.classList.add('is-active');
            } else {
                el.classList.remove('is-active');
            }
        }
    }

    let currentLang = null;
    function updateLabels() {
        const lang = getLocale();
        if (currentLang === lang) return;
        currentLang = lang;
        for (let i = 0; i < RAIL_MODULES.length; i++) {
            const mod = RAIL_MODULES[i];
            const labelEl = document.querySelector('.allsafex-rail-item[data-id="' + mod.id + '"] .allsafex-rail-label');
            const itemEl = document.querySelector('.allsafex-rail-item[data-id="' + mod.id + '"]');
            const text = getLabel(mod.id);
            if (labelEl && labelEl.textContent !== text) labelEl.textContent = text;
            if (itemEl && itemEl.getAttribute('title') !== text) itemEl.setAttribute('title', text);
        }
    }

    async function navigateToModule(mod) {
        const currentActive = detectActiveModule();
        if (currentActive === mod.id && window.location.hash.startsWith('#' + mod.path)) {
            return;
        }

        updateActiveUI(mod.id);
        try {
            localStorage.setItem('preView', mod.id);
        } catch(e) {}

        let targetPath = mod.path;
        try {
            const routes = window.__STORE__?.state?.permission?.viewRoutes || window.__STORE__?.getters?.viewRoutes;
            if (Array.isArray(routes)) {
                const found = routes.find(r => r.name === mod.id || r.meta?.view === mod.id);
                if (found) {
                    if (typeof found.redirect === 'string' && found.redirect) {
                        targetPath = found.redirect;
                    } else if (found.meta?.fullPath || found.path) {
                        targetPath = found.meta?.fullPath || found.path;
                    }
                }
            }
        } catch(e) {}

        if (window.__STORE__) {
            try {
                await window.__STORE__.dispatch('app/reset');
            } catch(e) {
                console.warn('[AllSafeX Rail] Store reset error:', e);
            }
        }

        if (window.__ROUTER__) {
            try {
                await window.__ROUTER__.push(targetPath);
                return;
            } catch(e) {
                console.warn('[AllSafeX Rail] Router push error:', e);
            }
        }

        window.location.hash = '#' + targetPath;
    }

    function createRailElement() {
        const rail = document.createElement('aside');
        rail.id = 'allsafex-primary-rail';
        rail.setAttribute('aria-label', 'Primary Navigation Rail');

        const activeId = detectActiveModule();

        RAIL_MODULES.forEach(mod => {
            const item = document.createElement('div');
            item.className = 'allsafex-rail-item' + (mod.id === activeId ? ' is-active' : '');
            item.setAttribute('data-id', mod.id);
            item.setAttribute('role', 'button');
            item.setAttribute('tabindex', '0');
            item.setAttribute('title', getLabel(mod.id));

            const iconWrap = document.createElement('div');
            iconWrap.className = 'allsafex-rail-icon';
            iconWrap.innerHTML = mod.icon;

            const label = document.createElement('span');
            label.className = 'allsafex-rail-label';
            label.textContent = getLabel(mod.id);

            item.appendChild(iconWrap);
            item.appendChild(label);

            item.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                navigateToModule(mod);
            });

            item.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    navigateToModule(mod);
                }
            });

            rail.appendChild(item);
        });

        return rail;
    }

    let isMounting = false;
    function ensureRailMounted() {
        if (isMounting) return;
        const sidebar = document.querySelector('.sidebar-container');
        const mainContainer = document.querySelector('.main-container');
        const existingRail = document.getElementById('allsafex-primary-rail');

        if (!sidebar || !mainContainer) {
            if (existingRail && existingRail.style.display !== 'none') {
                existingRail.style.display = 'none';
            }
            return;
        }

        if (!existingRail) {
            isMounting = true;
            try {
                const rail = createRailElement();
                mainContainer.insertBefore(rail, sidebar);
            } finally {
                isMounting = false;
            }
        } else {
            if (existingRail.parentElement !== mainContainer) {
                isMounting = true;
                try {
                    mainContainer.insertBefore(existingRail, sidebar);
                } finally {
                    isMounting = false;
                }
            }
            if (existingRail.style.display !== 'flex') {
                existingRail.style.display = 'flex';
            }
        }
        updateActiveUI(detectActiveModule());
        updateLabels();
    }

    window.addEventListener('hashchange', function() {
        updateActiveUI(detectActiveModule());
    });
    window.addEventListener('popstate', function() {
        updateActiveUI(detectActiveModule());
    });
    window.addEventListener('storage', function() {
        currentLang = null;
        updateActiveUI(detectActiveModule());
        updateLabels();
    });

    function initRail() {
        ensureRailMounted();
        setInterval(ensureRailMounted, 500);
    }

    if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initRail);
    } else {
        initRail();
    }
})();
</script>
</body>
</html>
