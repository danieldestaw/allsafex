{% load static %}

<!-- css file -->
<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
<link href="{% static 'css/font-awesome.min.css' %}" rel="stylesheet">
<link href="{% static 'css/plugins/toastr/toastr.min.css' %}" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet">
<link href="{% static 'css/plugins/select2/select2.min.css' %}" rel="stylesheet">

<!-- scripts -->
<script src="{% static 'js/jquery-3.6.1.min.js' %}"></script>
<script src="{% url 'javascript-catalog' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
<style>
    :root {
        --primary-color: #FF7900;
    }
</style>

<script>
  const themeInfo = {{ INTERFACE.theme_info | safe }};
  if (themeInfo && themeInfo.colors && themeInfo.colors['--color-primary']) {
      document.documentElement.style.setProperty('--primary-color', themeInfo.colors['--color-primary']);
  }
</script>


<style id="allsafex-core-theme">
    :root {
        --primary-color: #FF7900 !important;
        --color-primary: #FF7900 !important;
    }
    .btn-primary, .btn-primary:focus, .btn-primary:active, .btn-primary.active, .open .dropdown-toggle.btn-primary {
        background-color: #FF7900 !important;
        border-color: #FF7900 !important;
        color: #FFFFFF !important;
    }
    .btn-primary:hover {
        background-color: #e66d00 !important;
        border-color: #e66d00 !important;
        color: #FFFFFF !important;
    }
    .text-primary, a.text-primary:hover, a.text-primary:focus {
        color: #FF7900 !important;
    }
    .bg-primary {
        background-color: #FF7900 !important;
    }
    .label-primary, .badge-primary {
        background-color: #FF7900 !important;
    }
    .nav > li.active {
        border-left: 4px solid #FF7900 !important;
        background: #293846;
    }
    .nav > li.active > a {
        color: #FF7900 !important;
    }
    .pagination > .active > a, .pagination > .active > span, 
    .pagination > .active > a:hover, .pagination > .active > span:hover, 
    .pagination > .active > a:focus, .pagination > .active > span:focus {
        background-color: #FF7900 !important;
        border-color: #FF7900 !important;
    }
</style>
