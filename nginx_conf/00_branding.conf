port_in_redirect off;
absolute_redirect off;

location ^~ /static/img/ {
    alias /opt/static_img/;
    add_header Cache-Control "public, max-age=3600";
}

# Real AllSafeX Workspace Endpoint
location /allsafex-workspace/ {
    alias /opt/luna/;
    try_files $uri $uri/ /allsafex-workspace/index.html;
}

# Explicit clean redirects for file explorer with trailing slash
location = /allsafex-workspace/files {
    return 301 /allsafex-workspace/files/;
}

location ~ ^/luna/files/?$ {
    return 301 /allsafex-workspace/files/;
}

# Clean redirect preserving outer host/port
location ~ ^/luna/(.*)$ {
    return 301 /allsafex-workspace/$1;
}
